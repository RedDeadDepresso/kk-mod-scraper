name: Scrape mod index

on:
  schedule:
    # Runs at 03:00 UTC every day. Adjust to taste.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scraper
        env:
          # Which sources to run: a comma separated list of koikatsucards, betterrepack, mega,
          # drive, pixeldrain, dropbox, mediafire. Set it as a repository variable (Settings > Secrets and variables > Actions >
          # Variables > SCRAPE_SOURCES) to switch sources on and off without editing code.
          # Empty or unset = all of them.
          SCRAPE_SOURCES: ${{ vars.SCRAPE_SOURCES }}
          # Google Drive API key for the Drive folders in config/drive.json (see README).
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Optional: Pixeldrain API key; raises Pixeldrain's download limits (see README).
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          # Dropbox API credentials for config/dropbox.json (see README): a refresh token plus the
          # app key and secret of your Dropbox app (recommended), or just an access token.
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          # Optional: Cookie header of a logged in kknow.cc session, only needed if the forum
          # refuses searches from guests (see README).
          KKNOW_COOKIE: ${{ secrets.KKNOW_COOKIE }}
        run: go run .