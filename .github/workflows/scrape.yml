name: Scrape mod index

on:
  schedule:
    # Runs at 03:00 UTC every day. Adjust to taste.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scraper
        env:
          # Google Drive API key for the Drive folders in config/drive.json (see README).
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Optional: Cookie header of a logged in kknow.cc session, only needed if the forum
          # refuses searches from guests (see README).
          KKNOW_COOKIE: ${{ secrets.KKNOW_COOKIE }}
        run: go run .