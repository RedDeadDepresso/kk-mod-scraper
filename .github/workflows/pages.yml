name: Deploy data to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - data/**
      - internal/siteindex/**
      - cmd/buildsite/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Scrape mod index"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Deploy after a scrape that failed too: the scraper commits what worked before it reports
    # failures, and a failed folder keeps its previous index. Only a cancelled run is skipped.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin explicitly
          # so we always deploy the branch the scrape workflow just updated.
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build site from data
        run: |
          mkdir -p _site/indices
          # The folder is called data/ in the repo, but the site keeps publishing it under /indices/.
          cp -r data/. _site/indices/
          # telegram.json, data/mega/*.json, data/drive/*.json and data/pixeldrain/*.json, data/dropbox/*.json, data/mediafire/*.json and data/catbox/*.json and data/gofile/*.json are
          # published merged, as mod.json, rather than as separate files.
          rm -rf _site/indices/telegram.json _site/indices/mega _site/indices/drive _site/indices/pixeldrain _site/indices/dropbox _site/indices/mediafire _site/indices/catbox _site/indices/gofile

          # mod.json: {"<guid>": [{"version": "1.2", "mega": [link, ...], "drive": [...], "pixeldrain": [...],
          #            "dropbox": [...], "mediafire": [...], "catbox": [...], "gofile": [...], "telegram": [...]}, ...]}
          #  - One entry per version, newest first; an entry whose version is unknown ("version": "unknown")
          #    is always last. Every entry has all eight hosts; a host without a link has an empty list.
          #  - Versions are normalized (internal/siteindex/version.go): "1", "v1.0", "1.00" and "1.0.0"
          #    are all "1.0", so the same version is never listed twice.
          #  - Links of a host are de-duplicated (best link of each folder first, folders in file-name
          #    order); telegram links keep the newest-first order of telegram.json.
          #
          # modpack.json (betterrepack) is published in the same shape, replacing the raw copy made above:
          # {"<guid>": [{"version": "1.2", "betterrepack": [link, ...]}, ...]}, newest first, unknown last.
          go run ./cmd/buildsite -data data -out _site/indices/mod.json -modpack-out _site/indices/modpack.json
          ls -lR _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
