name: Deploy indices to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - indices/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Scrape mod index"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin explicitly
          # so we always deploy the branch the scrape workflow just updated.
          ref: main

      - name: Build site from indices
        run: |
          mkdir -p _site/indices
          cp -r indices/. _site/indices/
          # mod.json is stored as a newest-first list of mods. Publish it as a compact
          # {"guid":"link"} map instead; reverse so the newest entry wins on duplicate GUIDs.
          jq -c 'reverse | map({(.Guid): .Link}) | add // {}' indices/mod.json > _site/indices/mod.json
          echo "Generated $(jq 'length' _site/indices/mod.json) mod entries"
          ls -lR _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
