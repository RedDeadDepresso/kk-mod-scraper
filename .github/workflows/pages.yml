name: Deploy indices to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - indices/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Scrape mod index"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin explicitly
          # so we always deploy the branch the scrape workflow just updated.
          ref: main

      - name: Build site from indices
        run: |
          mkdir -p _site/indices
          cp -r indices/. _site/indices/
          # telegram.json, indices/mega/*.json and indices/drive/*.json are published merged,
          # as mod.json, rather than as separate files.
          rm -rf _site/indices/telegram.json _site/indices/mega _site/indices/drive

          # mod.json: {"<guid>": {"mega": [link, ...], "drive": [link, ...], "telegram": [link, ...]}, ...}
          #  - telegram: telegram.json is a newest-first list of mods; every link of a GUID
          #    is kept, newest first.
          #  - mega / drive: the "guids" maps of every folder in indices/mega/ and
          #    indices/drive/ (best link of each folder first, folders in file-name order).
          #  - Links are de-duplicated; a GUID known from only some sources gets an empty
          #    list for the others.
          shopt -s nullglob
          jq -n -c \
            --slurpfile t indices/telegram.json \
            --slurpfile m <(cat /dev/null indices/mega/*.json) \
            --slurpfile d <(cat /dev/null indices/drive/*.json) '
            def uniq: reduce .[] as $x ([]; if any(.[]; . == $x) then . else . + [$x] end);
            def folders: reduce (.[] | (.guids // {}) | to_entries[]) as $e ({}; .[$e.key] += $e.value) | map_values(uniq);
            ($t[0] | reduce .[] as $mod ({}; .[$mod.Guid] += [$mod.Link]) | map_values(uniq)) as $telegram
            | ($m | folders) as $mega
            | ($d | folders) as $drive
            | reduce (($telegram | keys) + ($mega | keys) + ($drive | keys) | unique)[] as $guid
                ({}; .[$guid] = {mega: ($mega[$guid] // []), drive: ($drive[$guid] // []), telegram: ($telegram[$guid] // [])})
          ' > _site/indices/mod.json
          echo "Generated $(jq 'length' _site/indices/mod.json) mod entries" \
            "($(jq '[.[] | select(.mega | length > 0)] | length' _site/indices/mod.json) with mega links," \
            "$(jq '[.[] | select(.drive | length > 0)] | length' _site/indices/mod.json) with drive links," \
            "$(jq '[.[] | select(.telegram | length > 0)] | length' _site/indices/mod.json) with telegram links)"
          ls -lR _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
