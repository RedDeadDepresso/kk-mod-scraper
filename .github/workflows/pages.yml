name: Deploy data to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - data/**
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Scrape mod index"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Deploy after a scrape that failed too: the scraper commits what worked before it reports
    # failures, and a failed folder keeps its previous index. Only a cancelled run is skipped.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin explicitly
          # so we always deploy the branch the scrape workflow just updated.
          ref: main

      - name: Build site from data
        run: |
          mkdir -p _site/indices
          # The folder is called data/ in the repo, but the site keeps publishing it under /indices/.
          cp -r data/. _site/indices/
          # telegram.json, data/mega/*.json, data/drive/*.json and data/pixeldrain/*.json, data/dropbox/*.json, data/mediafire/*.json and data/catbox/*.json and data/gofile/*.json are
          # published merged, as mod.json, rather than as separate files.
          rm -rf _site/indices/telegram.json _site/indices/mega _site/indices/drive _site/indices/pixeldrain _site/indices/dropbox _site/indices/mediafire _site/indices/catbox _site/indices/gofile

          # mod.json: {"<guid>": {"<version>": {"mega": [link, ...], "drive": [...], "pixeldrain": [...],
          #            "dropbox": [...], "mediafire": [...], "catbox": [...], "gofile": [...], "telegram": [...]}}}
          #  - Every version has all eight sources; a source without a link has an empty list.
          #  - A mod without a known version (no <version> in its manifest, a telegram post
          #    with "-", and all the forum mod packs) is filed under "unknown".
          #  - Versions are listed newest first, "unknown" last. Links of a source are
          #    de-duplicated (best link of each folder first, folders in file-name order).
          #  - telegram.json is a newest-first list of mods; its links keep that order.
          #  - data/<source>/*.json hold {"guids": {"<guid>": {"<version>": [link, ...]}}}.
          shopt -s nullglob
          jq -n -c \
            --slurpfile t data/telegram.json \
            --slurpfile m <(cat /dev/null data/mega/*.json) \
            --slurpfile d <(cat /dev/null data/drive/*.json) \
            --slurpfile p <(cat /dev/null data/pixeldrain/*.json) \
            --slurpfile x <(cat /dev/null data/dropbox/*.json) \
            --slurpfile f <(cat /dev/null data/mediafire/*.json) \
            --slurpfile c <(cat /dev/null data/catbox/*.json) \
            --slurpfile g <(cat /dev/null data/gofile/*.json) '
            def uniq: reduce .[] as $x ([]; if any(.[]; . == $x) then . else . + [$x] end);
            def vkey: [scan("[0-9]+") | tonumber];
            def unknown: "unknown";
            # {guid: {version: [link]}} from the index files of the folders of one source
            def folders: reduce (.[] | (.guids // {}) | to_entries[]) as $e ({};
              reduce ($e.value | to_entries[]) as $v (.; .[$e.key][$v.key] += $v.value));
            # newest version first, "unknown" last
            def order: to_entries
              | (map(select(.key != unknown)) | sort_by([(.key | vkey), .key]) | reverse)
                + map(select(.key == unknown))
              | from_entries;
            def tgversion: (. // "" | tostring | gsub("^\\s+|\\s+$"; "")) as $v
              | if $v == "" or $v == "-" then unknown else $v end;
            ($t[0] | reduce .[] as $mod ({}; .[$mod.Guid][$mod.Version | tgversion] += [$mod.Link])) as $telegram
            | {mega: ($m | folders), drive: ($d | folders), pixeldrain: ($p | folders), dropbox: ($x | folders),
               mediafire: ($f | folders), catbox: ($c | folders), gofile: ($g | folders), telegram: $telegram} as $sources
            | reduce ($sources | to_entries[]) as $s ({};
                reduce ($s.value | to_entries[]) as $e (.;
                  reduce ($e.value | to_entries[]) as $v (.; .[$e.key][$v.key][$s.key] += $v.value)))
            | map_values(map_values(. as $o
                | reduce ("mega","drive","pixeldrain","dropbox","mediafire","catbox","gofile","telegram") as $k
                    ({}; .[$k] = ($o[$k] // [] | uniq))) | order)
          ' > _site/indices/mod.json
          echo "Generated $(jq 'length' _site/indices/mod.json) mod entries" \
            "($(jq '[.[] | length] | add' _site/indices/mod.json) versions in total," \
            "$(jq '[.[] | select(has("unknown"))] | length' _site/indices/mod.json) with an unknown version)"
          ls -lR _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
